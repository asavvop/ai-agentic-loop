apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-self-healing-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-self-healing-agent-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-self-healing-agent-binding
subjects:
- kind: ServiceAccount
  name: k8s-self-healing-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-self-healing-agent-role
  apiGroup: rbac.authorization.k8s.io
